<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edutech · 한재상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --bg:#0b0b0b; --text:#e8e8e8; --muted:#7a7a7a; --line:#1e1e1e; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--text);font-size:16px;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px}

  header .wrap{display:flex;justify-content:flex-end;align-items:center;height:96px}
  nav{display:flex;gap:40px}
  nav a{font-size:17px;font-weight:400;color:var(--muted);transition:color .2s}
  nav a:hover,nav a.active{color:var(--text)}

  section{display:none;padding:72px 0 120px}
  section.show{display:block;animation:in .5s ease}
  @keyframes in{from{opacity:0}to{opacity:1}}

  h1{font-family:"Noto Serif KR",serif;font-weight:300;font-size:clamp(30px,5vw,42px);line-height:1.45;letter-spacing:-.03em}
  h2{font-size:16px;font-weight:400;color:var(--muted);margin-bottom:24px}
  .lead{color:var(--muted);margin-top:24px;max-width:480px}
  #home.show{display:flex;align-items:center;min-height:calc(100vh - 96px - 72px);padding:0}
  .name{font-family:"Noto Serif KR",serif;font-weight:300;font-size:clamp(44px,8vw,72px);letter-spacing:-.04em;line-height:1.1}
  .role{color:var(--muted);font-size:16px;letter-spacing:.04em;margin-top:18px}
  #about .name{font-size:clamp(30.8px,5.6vw,50.4px)}
  #about .role{font-size:20.8px}

  .list > a,.list > div{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
  .list > a:last-child,.list > div:last-child{border-bottom:1px solid var(--line)}
  .list a:hover .t{text-decoration:underline;text-underline-offset:5px}
  .list .m{color:var(--muted);font-size:16px;white-space:nowrap}
  .list p{color:var(--muted);font-size:16px;margin-top:2px}
  .list p.desc{color:#a8a8a8;margin-top:6px;word-break:keep-all}
  .block + .block{margin-top:72px}

  .info div{display:grid;grid-template-columns:180px 1fr;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
  .info dt{color:var(--muted);font-variant-numeric:tabular-nums}
  .info div:last-child{border-bottom:1px solid var(--line)}
  .pubs{list-style:none}
  .pubs li{display:grid;grid-template-columns:180px 1fr;padding:18px 0;border-top:1px solid var(--line);font-size:16px}
  .pubs li:last-child{border-bottom:1px solid var(--line)}
  .pubs .yr{color:var(--muted)}
  .pubs p{line-height:1.7;word-break:keep-all}
  .pubs i{color:var(--muted)}
  .mail{font-size:17px;border-bottom:1px solid var(--muted);padding-bottom:2px;transition:border-color .2s}
  .mail:hover{border-color:var(--text)}

  footer{padding:40px 0;color:var(--muted);font-size:16px}

  @media (max-width:560px){
    header .wrap{height:76px;justify-content:center}
    nav{gap:22px}
    nav a{font-size:16px}
    .info div,.pubs li{grid-template-columns:1fr;gap:2px}
  }
</style>
</head>
<body>

<header><div class="wrap">
  <nav>
    <a href="../">Home</a>
    <a href="../about/">About</a>
    <a href="../edutech/" class="active">Edutech</a>
    <a href="../research/">Research</a>
  </nav>
</div></header>

<main class="wrap">

      <a href="https://mms31001-spec.github.io/han_jae_sang_001/" target="_blank" rel="noopener"><div><span class="t">물리학으로 폭탄 피하기 (PC용)</span><p>2026</p></div><span class="m">↗</span></a>
      <a href="https://mms31001-spec.github.io/han_jae_sang_001/install.html" target="_blank" rel="noopener"><div><span class="t">물리학으로 폭탄 피하기 (모바일용)</span><p>2026</p></div><span class="m">↗</span></a>
    </div>
  </section>

</main>

</body>
</html>
